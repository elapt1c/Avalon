[package]
name = "avalon"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_plot = "0.38.0"
rustfft = "6.4.1"
symphonia = { version = "0.6.1", features = [
    "aac", "aiff", "alac", "caf", "isomp4", "mp1", "mp2", "mp3", "mpa",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rfd = "0.17.2"
ureq = "2"
flate2 = "1.1.10"
tar = "0.4.46"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
